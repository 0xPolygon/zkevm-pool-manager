name: Build docker image and run node tests

on:
  push:
    branches: [ develop ]

# Needed to push to GHCR with GITHUB_TOKEN
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GHCR (no Docker Hub needed)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # (Optional) Derive tags/labels automatically
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Image namespace in GHCR: ghcr.io/<owner>/<image>
          images: |
            ghcr.io/${{ github.repository_owner }}/zkevm-pool-manager
          tags: |
            type=raw,value=latest
            type=sha
            type=ref,event=branch

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          target: poolmanager
          # Use BuildKit cache to speed up builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Use tags & labels from metadata-action (includes :latest, :sha, etc.)
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
